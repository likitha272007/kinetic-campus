<!DOCTYPE html>
<html class="dark" lang="en">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Registration Successful | Kinetic Campus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@24,400,0,0" rel="stylesheet"/>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; }
        .glass-card { background: rgba(25, 37, 64, 0.4); backdrop-filter: blur(16px); border: 1px solid rgba(133, 173, 255, 0.1); }
        .glow { box-shadow: 0 0 30px rgba(133, 173, 255, 0.3); }
    </style>
</head>
<body class="bg-[#060e20] text-[#dee5ff] min-h-screen flex items-center justify-center p-6">
    <div class="max-w-md w-full glass-card rounded-[2.5rem] p-10 text-center relative overflow-hidden">
        <div class="absolute -top-24 -left-24 w-48 h-48 bg-[#85adff] opacity-10 blur-[80px]"></div>
        <div class="w-20 h-20 bg-[#85adff]/10 border border-[#85adff]/20 rounded-3xl flex items-center justify-center mx-auto mb-8 glow">
            <span class="material-symbols-outlined text-[#85adff] text-4xl">check_circle</span>
        </div>
        <h1 class="text-3xl font-black tracking-tight mb-4">Event <span class="text-[#85adff]">Broadcasted!</span></h1>
        <p class="text-[#a3aac4] text-sm leading-relaxed mb-10">
            Your pulse event has been successfully registered in the Kinetic Archive. Other explorers can now see and RSVP to your event.
        </p>
        <div class="space-y-4">
            <a href="/" class="block w-full py-4 rounded-2xl bg-[#85adff] text-[#002c66] font-extrabold text-sm hover:scale-[1.02] transition-all flex items-center justify-center gap-2">
                <span class="material-symbols-outlined text-sm">home</span>
                Go Back to Home
            </a>
            <a href="/explore" class="block w-full py-4 rounded-2xl bg-white/5 border border-white/10 text-white font-bold text-sm hover:bg-white/10 transition-all">
                View in Archive
            </a>
        </div>
    </div>
</body>
</html>
