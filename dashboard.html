<!DOCTYPE html>
<html class="dark">
<head>
    <title>Success | Kinetic Campus</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-[#060e20] text-[#dee5ff] flex items-center justify-center min-h-screen">
    <div class="max-w-md p-8 bg-[#192540] rounded-2xl shadow-2xl border border-[#85adff]/30 text-center">
        <div class="w-20 h-20 bg-[#85adff]/20 rounded-full flex items-center justify-center mx-auto mb-6">
            <span class="text-4xl text-[#85adff]">✓</span>
        </div>
        <h1 class="text-3xl font-bold mb-2">Profile Initialized</h1>
        <p class="mb-6">Welcome to the Electric Archive, <span class="text-[#85adff] font-bold">{{ user_name }}</span>.</p>
        <p class="text-sm opacity-70">You are now logged in as <strong>{{ role }}</strong>.</p>
        <a href="/" class="mt-8 inline-block text-[#85adff] hover:underline">Go to Homepage</a>
    </div>
</body>
</html>
